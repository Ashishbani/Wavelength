name: Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Deployed Wavelength URL the app should open (https://…)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor deps
        working-directory: mobile
        run: npm install

      - name: Bake the server URL into the app
        working-directory: mobile
        env:
          APP_URL: ${{ inputs.app_url }}
        run: |
          case "$APP_URL" in
            https://*) ;;
            *) echo "app_url must start with https://" >&2; exit 1 ;;
          esac
          npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wavelength-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
