name: Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Deployed Wavelength URL the app should open (https://…)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor deps
        working-directory: mobile
        run: npm install

      - name: Bake the server URL into the app
        working-directory: mobile
        env:
          RAW_URL: ${{ inputs.app_url }}
        run: |
          # Normalize the input: trim whitespace, drop a trailing slash, and
          # add https:// if the scheme was omitted.
          APP_URL="$(printf '%s' "$RAW_URL" | tr -d '[:space:]')"
          APP_URL="${APP_URL%/}"
          case "$APP_URL" in
            https://*) ;;
            http://*) echo "::error::Use the https:// address (got: $APP_URL)"; exit 1 ;;
            '') echo "::error::app_url input is empty"; exit 1 ;;
            *) APP_URL="https://$APP_URL" ;;
          esac
          echo "Building the app shell for: $APP_URL"
          APP_URL="$APP_URL" npx cap sync android
          echo "Baked native config:"
          cat android/app/src/main/assets/capacitor.config.json

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wavelength-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
